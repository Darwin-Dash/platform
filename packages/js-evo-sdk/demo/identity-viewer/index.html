<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Identity Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.connected {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.connecting {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.error {
            background: #f8d7da;
            color: #721c24;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 12px;
            margin-bottom: 0;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: monospace;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .network-toggle {
            display: flex;
            gap: 8px;
        }

        .network-toggle button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .network-toggle button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .network-toggle button.active {
            background: rgba(16, 185, 129, 0.3);
            border-color: rgba(16, 185, 129, 0.6);
            color: #34d399;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner-small {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .metric-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .metric-value {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            word-break: break-word;
            font-family: monospace;
            line-height: 1.4;
        }

        .metric-subvalue {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .info-card h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.5;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .info-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .info-label {
            color: #999;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #333;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .copy-button {
            display: inline-block;
            font-size: 11px;
            padding: 4px 8px;
            margin-top: 6px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            color: #666;
            font-weight: 600;
        }

        .copy-button:hover {
            background: #e0e0e0;
            border-color: #999;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 16px;
            padding: 40px 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .error-message h4 {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .error-message p {
            font-size: 13px;
            margin: 0;
        }

        .footer {
            text-align: center;
            color: white;
            font-size: 12px;
            margin-top: 40px;
            opacity: 0.8;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .last-updated {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .key-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 3px solid #667eea;
        }

        .key-purpose {
            font-size: 11px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .key-value {
            font-size: 11px;
            font-family: monospace;
            color: #333;
            word-break: break-all;
            line-height: 1.3;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .control-group {
                grid-template-columns: 1fr;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .metric-value {
                font-size: 16px;
            }

            .network-toggle {
                flex-wrap: wrap;
                justify-content: center;
            }

            .action-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        .tab-navigation {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            background: white;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f5f5f5;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: #efefef;
        }

        .tab-button.active {
            background: white;
            border-bottom-color: #667eea;
            color: #333;
        }

        .tab-content {
            background: white;
            border-radius: 0 0 10px 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dash Identity Viewer</h1>
            <p id="networkDescription">Testnet Identity Inspector</p>
            <span id="connectionStatus" class="status-badge connecting">Connecting...</span>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="form-group">
                    <label for="identityInput">Identity ID</label>
                    <input
                        type="text"
                        id="identityInput"
                        placeholder="Enter identity ID (e.g., DcoJJ3W9JauwLD51vzNuXJ9vnaZT7mprVm7wbgVYifNq)"
                    />
                </div>
                <div class="network-toggle">
                    <button id="testnetBtn" class="active">Testnet</button>
                    <button id="mainnetBtn">Mainnet</button>
                </div>
                <div class="action-buttons">
                    <button class="btn" id="searchBtn">Search</button>
                    <button class="btn" id="refreshBtn">Refresh</button>
                </div>
            </div>
        </div>

        <div id="error" class="error-message" style="display: none;"></div>

        <div id="loading" class="loading" style="display: none;">
            <span class="spinner"></span>
            <span>Loading identity information...</span>
        </div>

        <div id="dashboard" style="display: none;">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Identity ID</div>
                    <div class="metric-value" id="identityId" style="font-size: 14px;">—</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Balance (Credits)</div>
                    <div class="metric-value" id="balance">—</div>
                    <div class="metric-subvalue" id="balanceNote">—</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Public Keys</div>
                    <div class="metric-value" id="publicKeysCount">—</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Revision</div>
                    <div class="metric-value" id="revision">—</div>
                </div>
            </div>


            <div class="info-grid">
                <div class="info-card" id="publicKeysCard">
                    <h3>Public Keys</h3>
                    <div id="publicKeysList">—</div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        Built with <a href="https://github.com/dashevo/js-evo-sdk">js-evo-sdk</a> |
        <a href="https://github.com/dashevo">Dash Platform</a> |
        <span id="footerNetworkText">Testnet Identity Inspector</span>
        <div class="last-updated" id="lastUpdated">
            <span id="lastUpdatedText">Initializing...</span>
        </div>
    </div>

    <script type="module" src="./identity-viewer.js"></script>
</body>
</html>
